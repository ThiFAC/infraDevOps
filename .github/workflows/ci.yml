name: CI - Integração Contínua

# Dispara o pipeline a cada push e a cada Pull Request
on:
  push:
    branches: [ master, desenvolvimento ]
  pull_request:
    branches: [ master ]

jobs:
  # Job 1: Build e testes da aplicação
  build:
    name: Build e Testes
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configura o Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Instala as dependências
      - name: Instalar dependências
        run: npm install

      # 4. Gera o build de produção
      - name: Build da aplicação
        run: npm run build

      # 5. (Opcional) Executa os testes
      - name: Executar testes
        run: npm test -- --passWithNoTests

  # Job 2: Build da imagem Docker
  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # 6. Configura o Docker Buildx
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 7. Constrói a imagem Docker
      - name: Construir imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: meu-projeto-devops:latest